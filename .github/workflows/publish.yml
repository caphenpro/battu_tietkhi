name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and precise astronomy dependency
        run: python -m pip install --upgrade pip && python -m pip install ".[precise]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install --upgrade pip setuptools
      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python setup.py --version)"
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          echo "Package version: $PACKAGE_VERSION"
          echo "Release tag version: $RELEASE_VERSION"
          test "$PACKAGE_VERSION" = "$RELEASE_VERSION"
      - name: Build source distribution and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/battu-tietkhi/
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish distributions to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
